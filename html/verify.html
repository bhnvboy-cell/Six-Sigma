<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify a Certificate - Lean Six Sigma Training</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-chart-line"></i> Lean Six Sigma Training</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="quizzes.html">Quizzes</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-4">
                    <h1 class="section-title d-inline-block">Certificate Verification</h1>
                    <p class="text-muted mb-0">Scan the QR code on a certificate or enter its verification ID to confirm authenticity.</p>
                </div>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="verifyForm" class="row g-2 align-items-end">
                            <div class="col-md-8">
                                <label for="verificationId" class="form-label">Verification ID</label>
                                <input type="text" class="form-control" id="verificationId" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" required>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-primary w-100" id="verifySubmit">
                                    <i class="fas fa-magnifying-glass me-1"></i>Verify certificate
                                </button>
                            </div>
                        </form>
                        <div id="verifyResult" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1">&copy; 2026 Lean Six Sigma Training Course.</p>
            <p class="mb-0 small text-white-50">A Product of NR LAB</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/verify.js"></script>
</body>
</html>
