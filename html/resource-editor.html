<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Editor - Lean Six Sigma Training</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/resources.css" rel="stylesheet">
</head>
<body class="resource-body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-chart-line"></i> Lean Six Sigma Training</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="modules.html">Modules</a></li>
                    <li class="nav-item"><a class="nav-link" href="statistics.html">Statistics</a></li>
                    <li class="nav-item"><a class="nav-link" href="quizzes.html">Quizzes</a></li>
                    <li class="nav-item"><a class="nav-link" href="resources.html">Resources</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-project.html"><i class="fas fa-folder-open me-1"></i>My Project</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 resource-editor-shell">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <a href="resources.html" class="text-decoration-none"><i class="fas fa-arrow-left me-1"></i>Back to Resources</a>
            <a href="my-project.html" class="text-decoration-none"><i class="fas fa-folder-open me-1"></i>My Project</a>
        </div>

        <header class="resource-editor-header">
            <div id="resourceHeading">
                <span class="text-muted small"><i class="fas fa-spinner fa-spin me-1"></i>Loading template...</span>
            </div>
            <div id="resourceToolbar" class="resource-editor-toolbar d-none">
                <div class="resource-copy-name">
                    <label for="copyNameInput" class="form-label">Saved copy name</label>
                    <input type="text" class="form-control" id="copyNameInput" placeholder="Name this copy">
                </div>
                <div class="resource-toolbar-actions">
                    <button type="button" class="btn btn-outline-secondary" id="loadExampleBtn"><i class="fas fa-wand-magic-sparkles me-1"></i>Load example</button>
                    <button type="button" class="btn btn-outline-secondary" id="clearBtn"><i class="fas fa-eraser me-1"></i>Clear</button>
                    <button type="button" class="btn btn-outline-secondary" id="printBtn"><i class="fas fa-file-pdf me-1"></i>Export PDF</button>
                    <button type="button" class="btn btn-primary" id="saveBtn"><i class="fas fa-floppy-disk me-1"></i>Save copy</button>
                </div>
            </div>
            <div id="loginNotice"></div>
            <div id="editorStatus" class="resource-editor-status" role="status"></div>
        </header>

        <div id="resourceFormArea"></div>
    </main>

    <div id="printSheet" class="resource-print-sheet" aria-hidden="true"></div>

    <footer class="bg-dark text-white py-4 mt-5 resource-screen-footer">
        <div class="container text-center"><p class="mb-0">&copy; 2024 Lean Six Sigma Training Course.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/resource-catalog-data.js"></script>
    <script src="js/resource-store.js"></script>
    <script src="js/resource-editor.js"></script>
</body>
</html>
