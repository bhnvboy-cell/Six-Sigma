<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lean Six Sigma Training</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-chart-line"></i> Lean Six Sigma Training</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="modules.html">Modules</a>
                <a class="nav-link" href="syllabus.html">Syllabus</a>
                <a class="nav-link" href="statistics.html">Statistics</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="fas fa-user me-1"></i>Learner Login</h4></div>
                    <div class="card-body">
                        <p class="text-muted small">This demo stores your name and progress in this browser only. No password is sent anywhere.</p>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="beltLevel" class="form-label">Current belt level</label>
                                <select class="form-select" id="beltLevel">
                                    <option value="white">White Belt</option>
                                    <option value="yellow">Yellow Belt</option>
                                    <option value="green">Green Belt</option>
                                    <option value="black">Black Belt</option>
                                    <option value="master-black">Master Black Belt</option>
                                </select>
                                <div class="form-text">Controls which project templates are unlocked. You can change it later in your profile.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-right-to-bracket me-1"></i>Continue</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-5"><div class="container text-center"><p class="mb-0">&copy; 2024 Lean Six Sigma Training Course.</p></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
